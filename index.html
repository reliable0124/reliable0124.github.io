<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理科全科知识库</title>
    <!-- 引入 KaTeX 用于渲染数学与物理公式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <!-- 引入 KaTeX 自动渲染脚本并配置识别单 $ 符号 -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" 
            onload="renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError : false
            });">
    </script>

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-yellow: #fefce8;
            --accent-border: #fef08a;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.08);
            --radius-md: 10px;
            --radius-lg: 16px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background: var(--bg-color); 
            color: var(--text-main); 
            line-height: 1.6;
            min-height: 100vh;
        }

        /* 顶部导航条 */
        header { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color); 
            position: sticky; 
            top: 0; 
            z-index: 100; 
            box-shadow: var(--shadow-sm);
        }
        .nav-container { 
            max-width: 1080px; 
            margin: 0 auto; 
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            padding: 0 24px; 
            height: 68px; 
        }
        
        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .logo { 
            font-size: 20px; 
            font-weight: 800; 
            color: var(--primary-color); 
            cursor: pointer; 
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }
        .logo:hover { opacity: 0.85; }

        /* 右侧新增标语/文字 */
        .logo-tagline {
            font-size: 13px;
            font-weight: 500;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            padding-left: 12px;
            border-left: 2px solid var(--border-color);
            line-height: 1.2;
        }
        /* 右侧区域容器，保持两端/居中对齐 */
        .nav-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* 署名字体样式 */
        .author-credit {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 500;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 4px 12px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }

        .add-btn { 
            background: var(--primary-color); 
            color: white; 
            border: none; 
            padding: 9px 20px; 
            border-radius: 20px; 
            font-size: 14px; 
            cursor: pointer; 
            font-weight: 600; 
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
            transition: all 0.2s ease;
        }
        .add-btn:hover { 
            background: var(--primary-hover); 
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
        }

        main { max-width: 1080px; margin: 32px auto; padding: 0 24px; }

        /* 面包屑导航 */
        .breadcrumb-bar { 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            margin-bottom: 24px; 
            font-size: 14px; 
            color: var(--text-muted); 
            flex-wrap: wrap; 
        }
        .back-link { 
            color: var(--primary-color); 
            font-weight: 600; 
            cursor: pointer; 
            text-decoration: none; 
            transition: color 0.2s;
        }
        .back-link:hover { text-decoration: underline; color: var(--primary-hover); }

        /* 册别选项卡 (Tabs) 样式 */
        .volume-tabs { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 24px; 
            border-bottom: 2px solid var(--border-color); 
            padding-bottom: 2px; 
            overflow-x: auto;
        }
        .tab-btn { 
            background: none; 
            border: none; 
            padding: 10px 18px; 
            font-size: 14px; 
            font-weight: 600; 
            color: var(--text-muted); 
            cursor: pointer; 
            border-radius: var(--radius-md) var(--radius-md) 0 0; 
            transition: all 0.2s; 
            white-space: nowrap;
        }
        .tab-btn:hover { color: var(--primary-color); background: var(--primary-light); }
        .tab-btn.active { color: var(--primary-color); border-bottom: 3px solid var(--primary-color); background: #ffffff; }

        /* 卡片网格布局 */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: var(--radius-lg); 
            border: 1px solid var(--border-color); 
            cursor: pointer; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); 
            position: relative; 
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card:hover { 
            transform: translateY(-4px); 
            box-shadow: var(--shadow-lg); 
            border-color: #93c5fd; 
        }
        .card h3 { font-size: 17px; margin-bottom: 8px; color: var(--text-main); font-weight: 700; line-height: 1.4; }
        .card p { font-size: 13px; color: var(--text-muted); margin-bottom: 16px; }
        .card .badge { 
            display: inline-block; 
            align-self: flex-start;
            padding: 4px 10px; 
            background: var(--primary-light); 
            color: var(--primary-color); 
            font-size: 12px; 
            border-radius: 6px; 
            font-weight: 600; 
        }
        .card .vol-tag { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            font-size: 11px; 
            padding: 3px 8px; 
            border-radius: 6px; 
            background: #f1f5f9; 
            color: var(--text-muted); 
            font-weight: 600; 
        }

        /* 视图页面控制 */
        .view-page { display: none; }
        .view-page.active { 
            display: block; 
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 详情页 */
        .detail-view { background: #fff; padding: 40px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-md); }
        .detail-header { 
            background: linear-gradient(135deg, #2563eb, #1d4ed8); 
            color: #fff; 
            padding: 28px 32px; 
            border-radius: var(--radius-md); 
            margin-bottom: 32px; 
            position: relative; 
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.2);
        }
        .edit-btn { 
            position: absolute; 
            right: 24px; 
            top: 24px; 
            background: rgba(255,255,255,0.2); 
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.3); 
            color: white; 
            padding: 8px 16px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 13px; 
            font-weight: 500;
            transition: all 0.2s;
        }
        .edit-btn:hover { background: rgba(255,255,255,0.3); }
        .note-body { font-size: 16px; line-height: 1.8; color: #334155; }
        .box-yellow { background: var(--accent-yellow); border: 1px solid var(--accent-border); border-radius: 8px; padding: 16px; margin: 16px 0; font-size: 14px; }

        /* 弹窗 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: white; padding: 32px; border-radius: var(--radius-lg); width: 90%; max-width: 560px; box-shadow: var(--shadow-lg); }
        .modal-content h3 { margin-bottom: 20px; font-size: 18px; color: var(--text-main); }
        .modal-content input, .modal-content textarea, .modal-content select { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 16px; 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .modal-content input:focus, .modal-content textarea:focus, .modal-content select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 8px; }
        .modal-actions button { padding: 9px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; }

        /* 响应式调整 */
        @media (max-width: 640px) {
            .logo-tagline { display: none; }
            .nav-container { padding: 0 16px; }
            main { padding: 0 16px; margin: 20px auto; }
            .detail-view { padding: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo-group">
                <div class="logo" onclick="navTo('level-1')">🔬 理科知识库</div>
                <div class="logo-tagline">探索自然科学的终极秩序</div>
            </div>

            <div class="nav-right">
                <span class="author-credit">育青中学2026年高一理制作</span>
                <button class="add-btn" onclick="openAddModal()">+ 新建知识点小节</button>
            </div>
        </div>
    </header>

    <main>

        <!-- 第 1 层：学科选择 (首页) -->
        <div id="level-1" class="view-page active">
            <h2 style="margin-bottom: 20px; font-weight: 800; font-size: 22px;">选择学科专栏</h2>
            <div class="card-grid">
                <div class="card" onclick="openSubject('math')">
                    <div>
                        <h3>📐 高级数学</h3>
                        <p>涵盖高等微积分、线性代数与概率论体系</p>
                    </div>
                    <span class="badge" id="badge-math">建设中</span>
                </div>
                <div class="card" onclick="openSubject('physics')">
                    <div>
                        <h3>⚡ 物理</h3>
                        <p>上册、中册、下册 · 共 27 章核心知识</p>
                    </div>
                    <span class="badge" id="badge-physics">加载中...</span>
                </div>
                <div class="card" onclick="openSubject('chemistry')">
                    <div>
                        <h3>🧪 化学</h3>
                        <p>无机化学、有机结构与化学反应动力学</p>
                    </div>
                    <span class="badge" id="badge-chemistry">建设中</span>
                </div>
                <div class="card" onclick="openSubject('biology')">
                    <div>
                        <h3>🧬 生物</h3>
                        <p>分子生物学、遗传学与生态演化系统</p>
                    </div>
                    <span class="badge" id="badge-biology">建设中</span>
                </div>
            </div>
        </div>

        <!-- 第 2 层：章节列表页 (物理 27 章，包含上中下册卡片过滤) -->
        <div id="level-2" class="view-page">
            <div class="breadcrumb-bar">
                <span class="back-link" onclick="navTo('level-1')">首页</span>
                <span>/</span>
                <span id="nav-subject-name" style="font-weight: 600; color: var(--text-main);">物理</span>
            </div>
            
            <h2 style="margin-bottom: 16px; font-weight: 800; font-size: 22px;" id="subject-title">章节目录</h2>

            <!-- 上册、中册、下册 分类选项卡 -->
            <div class="volume-tabs">
                <button class="tab-btn active" onclick="filterVolume('all', this)">全部 (27章)</button>
                <button class="tab-btn" onclick="filterVolume('upper', this)">上册 (第1-11章)</button>
                <button class="tab-btn" onclick="filterVolume('middle', this)">中册 (第12-20章)</button>
                <button class="tab-btn" onclick="filterVolume('lower', this)">下册 (第21-27章)</button>
            </div>

            <div class="card-grid" id="chapters-grid"></div>
        </div>

        <!-- 第 3 层：小节卡片列表页 -->
        <div id="level-3" class="view-page">
            <div class="breadcrumb-bar">
                <span class="back-link" onclick="navTo('level-1')">首页</span>
                <span>/</span>
                <span class="back-link" onclick="navTo('level-2')" id="nav-chapter-subject">物理</span>
                <span>/</span>
                <span id="nav-chapter-name" style="font-weight: 600; color: var(--text-main);">第一章</span>
            </div>
            <h2 style="margin-bottom: 20px; font-weight: 800; font-size: 22px;" id="chapter-title">小节列表</h2>
            <div class="card-grid" id="sections-grid"></div>
        </div>

        <!-- 第 4 层：笔记正文详情页 -->
        <div id="level-4" class="view-page">
            <div class="breadcrumb-bar">
                <span class="back-link" onclick="navTo('level-1')">首页</span>
                <span>/</span>
                <span class="back-link" onclick="navTo('level-2')">章节</span>
                <span>/</span>
                <span class="back-link" onclick="navTo('level-3')" id="nav-section-chapter">小节列表</span>
            </div>

            <div class="detail-view">
                <div class="detail-header">
                    <button class="edit-btn" onclick="openEditModal()">✏️ 编辑本节笔记</button>
                    <h2 id="detail-title" style="font-size: 24px; font-weight: 800;">小节标题</h2>
                </div>
                <div id="detail-content" class="note-body"></div>
            </div>
        </div>

    </main>

    <!-- 编辑/新建弹窗 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-heading">新增/编辑小节笔记</h3>
            <select id="modal-chapter-select"></select>
            <input type="text" id="modal-title" placeholder="小节标题">
            <input type="text" id="modal-desc" placeholder="简短摘要">
            <textarea id="modal-content" rows="8" placeholder="笔记正文 (支持 HTML & LaTeX 公式)"></textarea>
            
            <div class="modal-actions">
                <button onclick="closeModal()" style="background: #f1f5f9; color: var(--text-muted);">取消</button>
                <button style="background: var(--primary-color); color: white;" onclick="saveSectionNote()">保存</button>
            </div>
        </div>
    </div>

    <script src="physics-data.js"></script>
    
    <script>
        // 本地数据加载
        let sections = JSON.parse(localStorage.getItem('physics_sections')) || defaultSections;
        let currentSubject = 'physics';
        let currentVolumeFilter = 'all';
        let currentChapterId = '';
        let currentSectionId = '';

        // 页面跳转控制器
        function navTo(levelId) {
            document.querySelectorAll('.view-page').forEach(el => el.classList.remove('active'));
            document.getElementById(levelId).classList.add('active');
        }

        // 状态更新
        function updateMainBadges() {
            const pCount = sections.length;
            document.getElementById('badge-physics').innerText = `${physicsChapters.length} 章 / 已存 ${pCount} 节`;
        }

        // 第一层 -> 第二层
        function openSubject(sub) {
            currentSubject = sub;
            if(sub !== 'physics') {
                alert('该学科框架建设中，请先体验物理专栏！');
                return;
            }
            
            document.getElementById('nav-subject-name').innerText = '物理';
            renderChaptersGrid();
            navTo('level-2');
        }

        // 筛选选项卡切换
        function filterVolume(vol, btnEl) {
            currentVolumeFilter = vol;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            renderChaptersGrid();
        }

        // 渲染章节列表卡片
        function renderChaptersGrid() {
            const grid = document.getElementById('chapters-grid');
            grid.innerHTML = '';

            const filteredChapters = currentVolumeFilter === 'all' 
                ? physicsChapters 
                : physicsChapters.filter(ch => ch.volume === currentVolumeFilter);

            filteredChapters.forEach(ch => {
                const count = sections.filter(s => s.chapterId === ch.id).length;
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openChapter(ch.id);
                card.innerHTML = `
                    <span class="vol-tag">${ch.volName}</span>
                    <div>
                        <h3>${ch.title}</h3>
                        <p>${ch.desc}</p>
                    </div>
                    <span class="badge">${count} 个已写小节</span>
                `;
                grid.appendChild(card);
            });
        }

        // 第二层 -> 第三层 (进入具体章节的小节列表)
        function openChapter(chId) {
            currentChapterId = chId;
            const chapter = physicsChapters.find(c => c.id === chId);
            
            document.getElementById('nav-chapter-name').innerText = chapter.title;
            document.getElementById('chapter-title').innerText = `${chapter.volName} · ${chapter.title}`;

            renderSectionsGrid();
            navTo('level-3');
        }

        function renderSectionsGrid() {
            const grid = document.getElementById('sections-grid');
            grid.innerHTML = '';

            const subSections = sections.filter(s => s.chapterId === currentChapterId);

            if(subSections.length === 0) {
                grid.innerHTML = `<p style="color:var(--text-muted); grid-column:1/-1;">本章暂无小节笔记，请点击右上角“+ 新建知识点小节”添加！</p>`;
            } else {
                subSections.forEach(sec => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openSectionDetail(sec.id);
                    card.innerHTML = `<h3>${sec.title}</h3><p>${sec.desc || '点击查看完整笔记...'}</p>`;
                    grid.appendChild(card);
                });
            }
        }

        // 第三层 -> 第四层 (进入正文)
        function openSectionDetail(secId) {
            currentSectionId = secId;
            const sec = sections.find(s => s.id === secId);
            if (!sec) return;
        
            document.getElementById('detail-title').innerText = sec.title;
            document.getElementById('detail-content').innerHTML = sec.content;
        
            // 1. 切换到第 4 层详情页
            navTo('level-4');
        
            // 2. 调用 KaTeX 渲染（支持单 $ 和双 $$ 符号）
            if (window.renderMathInElement) {
                renderMathInElement(document.getElementById('detail-content'), {
                    delimiters: [
                        {left: '$$', right: '$$', display: true},
                        {left: '$', right: '$', display: false}
                    ],
                    throwOnError: false
                });
            }
        }

        // 弹窗逻辑
        function openAddModal() {
            currentSectionId = null;
            document.getElementById('modal-heading').innerText = '新建小节笔记';
            
            // 动态填充章节下拉框，带上分册提示
            const select = document.getElementById('modal-chapter-select');
            select.innerHTML = '';
            physicsChapters.forEach(ch => {
                select.innerHTML += `<option value="${ch.id}">[${ch.volName}] ${ch.title}</option>`;
            });
            if(currentChapterId) select.value = currentChapterId;

            document.getElementById('modal-title').value = '';
            document.getElementById('modal-desc').value = '';
            document.getElementById('modal-content').value = '';
            document.getElementById('modal').style.display = 'flex';
        }

        function openEditModal() {
            const sec = sections.find(s => s.id === currentSectionId);
            if(!sec) return;

            document.getElementById('modal-heading').innerText = '编辑小节笔记';
            
            const select = document.getElementById('modal-chapter-select');
            select.innerHTML = '';
            physicsChapters.forEach(ch => {
                select.innerHTML += `<option value="${ch.id}">[${ch.volName}] ${ch.title}</option>`;
            });
            select.value = sec.chapterId;

            document.getElementById('modal-title').value = sec.title;
            document.getElementById('modal-desc').value = sec.desc;
            document.getElementById('modal-content').value = sec.content;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function saveSectionNote() {
            const chapterId = document.getElementById('modal-chapter-select').value;
            const title = document.getElementById('modal-title').value;
            const desc = document.getElementById('modal-desc').value;
            const content = document.getElementById('modal-content').value;

            if(!title) { alert('小节标题不能为空！'); return; }

            if(currentSectionId) {
                const sec = sections.find(s => s.id === currentSectionId);
                sec.chapterId = chapterId;
                sec.title = title;
                sec.desc = desc;
                sec.content = content;
                openSectionDetail(currentSectionId);
            } else {
                const newSec = {
                    id: 'sec-' + Date.now(),
                    chapterId, title, desc, content
                };
                sections.unshift(newSec);
                currentChapterId = chapterId;
                openChapter(chapterId);
            }

            localStorage.setItem('physics_sections', JSON.stringify(sections));
            closeModal();
            updateMainBadges();
        }

        // 初始化页面
        updateMainBadges();
    </script>
</body>
</html>
