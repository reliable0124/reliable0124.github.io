<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理科笔记 - 多级卡片导航</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-yellow: #fefce8;
            --accent-border: #fef08a;
            --accent-blue: #f0f9ff;
            --accent-blue-border: #bae6fd;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-main); line-height: 1.6; }

        header { background: #ffffff; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 64px; }
        .logo { font-size: 18px; font-weight: 700; color: var(--primary-color); cursor: pointer; }

        .add-btn { background: var(--primary-color); color: white; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; font-weight: 600; }
        .add-btn:hover { background: var(--primary-hover); }

        main { max-width: 1000px; margin: 24px auto; padding: 0 20px; }

        /* 通用返回与路径栏 */
        .breadcrumb-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 14px; color: var(--text-muted); }
        .back-link { color: var(--primary-color); font-weight: 600; cursor: pointer; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }

        /* 网格卡片样式 */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
        .card { background: var(--card-bg); padding: 22px; border-radius: 12px; border: 1px solid var(--border-color); cursor: pointer; transition: all 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.04); border-color: var(--primary-color); }
        .card h3 { font-size: 17px; margin-bottom: 8px; color: var(--text-main); }
        .card p { font-size: 13px; color: var(--text-muted); }
        .card .badge { display: inline-block; padding: 2px 8px; background: var(--primary-light); color: var(--primary-color); font-size: 12px; border-radius: 4px; margin-top: 10px; font-weight: 500; }

        /* 页面显示切换控制 */
        .view-page { display: none; }
        .view-page.active { display: block; }

        /* 详情页排版 */
        .detail-view { background: #fff; padding: 32px; border-radius: 16px; border: 1px solid var(--border-color); }
        .detail-header { background: var(--primary-color); color: #fff; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; }
        .edit-btn { float: right; background: rgba(255,255,255,0.2); border: none; color: white; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .note-body { font-size: 15px; line-height: 1.8; color: #334155; }
        .box-yellow { background: var(--accent-yellow); border: 1px solid var(--accent-border); border-radius: 8px; padding: 14px; margin-top: 12px; font-size: 14px; }

        /* 弹窗样式 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: white; padding: 24px; border-radius: 12px; width: 90%; max-width: 500px; }
        .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid var(--border-color); border-radius: 6px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
        .modal-actions button { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo" onclick="showMainPage()">🔬 理科知识库</div>
            <button class="add-btn" onclick="openAddModal()">+ 新增子卡片</button>
        </div>
    </header>

    <main>

        <!-- 第一层：顶级主题卡片页面 -->
        <div id="page-main" class="view-page active">
            <h2 style="margin-bottom: 16px;">选择学科主题</h2>
            <div class="card-grid">
                <div class="card" onclick="openSubPage('math')">
                    <h3>📐 高级数学</h3>
                    <p>微积分、线性代数、概率论等专题</p>
                    <span class="badge" id="count-math">0 篇卡片</span>
                </div>
                <div class="card" onclick="openSubPage('physics')">
                    <h3>⚡ 物理</h3>
                    <p>力学、电磁学、热学、量子力学</p>
                    <span class="badge" id="count-physics">0 篇卡片</span>
                </div>
                <div class="card" onclick="openSubPage('chemistry')">
                    <h3>🧪 化学</h3>
                    <p>无机化学、有机化学、物理化学</p>
                    <span class="badge" id="count-chemistry">0 篇卡片</span>
                </div>
                <div class="card" onclick="openSubPage('biology')">
                    <h3>🧬 生物</h3>
                    <p>细胞生物学、遗传学、分子生物学</p>
                    <span class="badge" id="count-biology">0 篇卡片</span>
                </div>
            </div>
        </div>

        <!-- 第二层：跳转后的子卡片列表页面 -->
        <div id="page-sub" class="view-page">
            <div class="breadcrumb-bar">
                <span class="back-link" onclick="showMainPage()">← 返回主题列表</span>
                <span>/</span>
                <span id="sub-page-title" style="font-weight: 600;">专栏卡片列表</span>
            </div>
            
            <div class="card-grid" id="sub-card-grid">
                <!-- 这里将动态填充子卡牌 -->
            </div>
        </div>

        <!-- 第三层：卡片详情（笔记正文）界面 -->
        <div id="page-detail" class="view-page">
            <div class="breadcrumb-bar">
                <span class="back-link" onclick="backToSubPage()">← 返回卡片列表</span>
                <span>/</span>
                <span id="detail-subject-name">专栏</span>
            </div>

            <div class="detail-view">
                <div class="detail-header">
                    <button class="edit-btn" onclick="openEditModal()">✏️ 编辑卡片</button>
                    <h2 id="detail-title">卡片标题</h2>
                </div>
                <div id="detail-content" class="note-body"></div>
            </div>
        </div>

    </main>

    <!-- 弹窗 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-heading">添加卡片</h3>
            <select id="modal-cat">
                <option value="math">高级数学</option>
                <option value="physics">物理</option>
                <option value="chemistry">化学</option>
                <option value="biology">生物</option>
            </select>
            <input type="text" id="modal-title" placeholder="卡片标题 (如: 导数与微分)">
            <input type="text" id="modal-desc" placeholder="简短描述...">
            <textarea id="modal-content" rows="6" placeholder="详细内容..."></textarea>
            
            <div class="modal-actions">
                <button onclick="closeModal()">取消</button>
                <button style="background: var(--primary-color); color: white;" onclick="saveNote()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // 初始化数据示例
        const defaultNotes = [
            { id: '1', cat: 'math', title: '微积分 - 极限', desc: '等价无穷小与洛必达法则', content: '<p>这里是微积分极限部分的内容...</p><div class="box-yellow">重点公式：1 - cos(x) ~ 1/2 * x²</div>' },
            { id: '2', cat: 'math', title: '线性代数 - 矩阵', desc: '逆矩阵与特征值求解', content: '<p>这里是矩阵运算内容...</p>' },
            { id: '3', cat: 'physics', title: '电磁学 - 麦克斯韦方程', desc: '经典电磁学四大方程', content: '<p>电磁感应与电磁波基础知识...</p>' }
        ];

        let notes = JSON.parse(localStorage.getItem('nested_cards_data')) || defaultNotes;
        let currentSubject = ''; // 当前处于哪个大类
        let currentCardId = '';   // 当前查看的卡片ID

        const subjectNames = { math: '高级数学', physics: '物理', chemistry: '化学', biology: '生物' };

        // 切换页面显示函数
        function showPage(pageId) {
            document.querySelectorAll('.view-page').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        // 更新首页统计角标
        function updateCounts() {
            ['math', 'physics', 'chemistry', 'biology'].forEach(cat => {
                const count = notes.filter(n => n.cat === cat).length;
                document.getElementById(`count-${cat}`).innerText = `${count} 篇卡片`;
            });
            localStorage.setItem('nested_cards_data', JSON.stringify(notes));
        }

        // 第一层 -> 第二层：点击主题卡片后跳转
        function openSubPage(cat) {
            currentSubject = cat;
            document.getElementById('sub-page-title').innerText = subjectNames[cat] + ' · 内部卡片';
            
            const grid = document.getElementById('sub-card-grid');
            grid.innerHTML = '';
            
            const subNotes = notes.filter(n => n.cat === cat);

            if(subNotes.length === 0) {
                grid.innerHTML = `<p style="color:var(--text-muted); grid-column: 1/-1;">当前学科还没有卡片，请点击右上角新增卡片！</p>`;
            } else {
                subNotes.forEach(note => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openDetailPage(note.id);
                    card.innerHTML = `<h3>${note.title}</h3><p>${note.desc || '点击查看详情...'}</p>`;
                    grid.appendChild(card);
                });
            }

            showPage('page-sub');
        }

        // 返回第一层主页
        function showMainPage() {
            updateCounts();
            showPage('page-main');
        }

        // 第二层 -> 第三层：点击子卡片进入详情页
        function openDetailPage(id) {
            currentCardId = id;
            const note = notes.find(n => n.id === id);
            if (!note) return;

            document.getElementById('detail-subject-name').innerText = subjectNames[note.cat];
            document.getElementById('detail-title').innerText = note.title;
            document.getElementById('detail-content').innerHTML = note.content;

            showPage('page-detail');
        }

        // 从详情页退回第二层卡片页
        function backToSubPage() {
            openSubPage(currentSubject);
        }

        // 弹窗与新增修改功能
        function openAddModal() {
            currentCardId = null;
            document.getElementById('modal-heading').innerText = '新建卡片';
            if(currentSubject) document.getElementById('modal-cat').value = currentSubject;
            document.getElementById('modal-title').value = '';
            document.getElementById('modal-desc').value = '';
            document.getElementById('modal-content').value = '';
            document.getElementById('modal').style.display = 'flex';
        }

        function openEditModal() {
            const note = notes.find(n => n.id === currentCardId);
            if(!note) return;
            document.getElementById('modal-heading').innerText = '编辑卡片';
            document.getElementById('modal-cat').value = note.cat;
            document.getElementById('modal-title').value = note.title;
            document.getElementById('modal-desc').value = note.desc;
            document.getElementById('modal-content').value = note.content;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function saveNote() {
            const cat = document.getElementById('modal-cat').value;
            const title = document.getElementById('modal-title').value;
            const desc = document.getElementById('modal-desc').value;
            const content = document.getElementById('modal-content').value;

            if (!title) { alert('标题不能为空！'); return; }

            if (currentCardId) {
                const note = notes.find(n => n.id === currentCardId);
                note.cat = cat; note.title = title; note.desc = desc; note.content = content;
                openDetailPage(currentCardId);
            } else {
                const newNote = { id: 'card-' + Date.now(), cat, title, desc, content };
                notes.unshift(newNote);
                openSubPage(cat);
            }

            closeModal();
            updateCounts();
        }

        // 初始化页面
        updateCounts();
    </script>
</body>
</html>
