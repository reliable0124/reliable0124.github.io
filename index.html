<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>理科全科知识库 - 物理专栏</title>
    <!-- 引入 KaTeX 用于渲染渲染物理与数学公式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body);"></script>

    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --accent-yellow: #fefce8;
            --accent-border: #fef08a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-main); line-height: 1.6; }

        header { background: #ffffff; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 100; }
        .nav-container { max-width: 1000px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 64px; }
        .logo { font-size: 18px; font-weight: 700; color: var(--primary-color); cursor: pointer; }
        
        .add-btn { background: var(--primary-color); color: white; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; font-weight: 600; }
        .add-btn:hover { background: var(--primary-hover); }

        main { max-width: 1000px; margin: 24px auto; padding: 0 20px; }

        /* 面包屑导航 */
        .breadcrumb-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; font-size: 14px; color: var(--text-muted); flex-wrap: wrap; }
        .back-link { color: var(--primary-color); font-weight: 600; cursor: pointer; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }

        /* 卡片网格布局 */
        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); cursor: pointer; transition: all 0.2s; position: relative; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.04); border-color: var(--primary-color); }
        .card h3 { font-size: 16px; margin-bottom: 6px; color: var(--text-main); }
        .card p { font-size: 13px; color: var(--text-muted); }
        .card .badge { display: inline-block; padding: 2px 8px; background: var(--primary-light); color: var(--primary-color); font-size: 12px; border-radius: 4px; margin-top: 10px; font-weight: 500; }

        /* 视图页面控制 */
        .view-page { display: none; }
        .view-page.active { display: block; }

        /* 详情页 */
        .detail-view { background: #fff; padding: 32px; border-radius: 16px; border: 1px solid var(--border-color); }
        .detail-header { background: var(--primary-color); color: #fff; padding: 20px 24px; border-radius: 12px; margin-bottom: 24px; position: relative; }
        .edit-btn { position: absolute; right: 20px; top: 20px; background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .note-body { font-size: 15px; line-height: 1.8; color: #334155; }
        .box-yellow { background: var(--accent-yellow); border: 1px solid var(--accent-border); border-radius: 8px; padding: 14px; margin: 12px 0; font-size: 14px; }

        /* 弹窗 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); justify-content: center; align-items: center; z-index: 200; }
        .modal-content { background: white; padding: 24px; border-radius: 12px; width: 90%; max-width: 520px; }
        .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid var(--border-color); border-radius: 6px; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }
        .modal-actions button { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <div class="logo" onclick="navTo('level-1')">🔬 理科知识库</div>
            <button class="add-btn" onclick="openAddModal()">+ 新建知识点小节</button>
        </div>
    </header>

    <main>

        <!-- 第 1 层：学科选择 (首页) -->
        <div id="level-1" class="view-page active">
            <h2 style="margin-bottom: 16px;">选择学科</h2>
            <div class="card-grid">
                <div class="card" onclick="openSubject('math')">
                    <h3>📐 高级数学</h3>
                    <p>-</p>
                    <span class="badge" id="badge-math">建设中</span>
                </div>
                <div class="card" onclick="openSubject('physics')">
                    <h3>⚡ 物理</h3>
                    <p>高一至高三 · 共27章</p>
                    <span class="badge" id="badge-physics">加载中...</span>
                </div>
                <div class="card" onclick="openSubject('chemistry')">
                    <h3>🧪 化学</h3>
                    <p>-</p>
                    <span class="badge" id="badge-chemistry">建设中</span>
                </div>
                <div class="card" onclick="openSubject('biology')">
                    <h3>🧬-</h3>
                    <p>-</p>
                    <span class="badge" id="badge-biology">建设中</span>
                </div>
            </div>
        </div>

        <!-- 第 2 层：章节列表页 (例如：物理的 27 个大章) -->
        <div id="level-2" class="view-page">
            <div class="breadcrumb-bar">
                <span class="back-link" onclick="navTo('level-1')">首页</span>
                <span>/</span>
                <span id="nav-subject-name" style="font-weight: 600;">物理</span>
            </div>
            <h2 style="margin-bottom: 16px;" id="subject-title">章节目录</h2>
            <div class="card-grid" id="chapters-grid"></div>
        </div>

        <!-- 第 3 层：小节卡片列表页 (例如：第一章内的 7-8 个小节) -->
        <div id="level-3" class="view-page">
            <div class="breadcrumb-bar">
                <span class="back-link" onclick="navTo('level-1')">首页</span>
                <span>/</span>
                <span class="back-link" onclick="navTo('level-2')" id="nav-chapter-subject">物理</span>
                <span>/</span>
                <span id="nav-chapter-name" style="font-weight: 600;">第一章</span>
            </div>
            <h2 style="margin-bottom: 16px;" id="chapter-title">小节列表</h2>
            <div class="card-grid" id="sections-grid"></div>
        </div>

        <!-- 第 4 层：笔记正文详情页 -->
        <div id="level-4" class="view-page">
            <div class="breadcrumb-bar">
                <span class="back-link" onclick="navTo('level-1')">首页</span>
                <span>/</span>
                <span class="back-link" onclick="navTo('level-2')">章节</span>
                <span>/</span>
                <span class="back-link" onclick="navTo('level-3')" id="nav-section-chapter">小节列表</span>
            </div>

            <div class="detail-view">
                <div class="detail-header">
                    <button class="edit-btn" onclick="openEditModal()">✏️ 编辑本节笔记</button>
                    <h2 id="detail-title">小节标题</h2>
                </div>
                <div id="detail-content" class="note-body"></div>
            </div>
        </div>

    </main>

    <!-- 编辑/新建弹窗 -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h3 id="modal-heading">新增/编辑小节笔记</h3>
            <select id="modal-chapter-select"></select>
            <input type="text" id="modal-title" placeholder="小节标题 (例: 1.1 质点 参考系)">
            <input type="text" id="modal-desc" placeholder="简短摘要 (例: 质点条件与参考系选择)">
            <textarea id="modal-content" rows="8" placeholder="笔记正文 (支持 HTML & LaTeX 公式，如 $F=ma$)"></textarea>
            
            <div class="modal-actions">
                <button onclick="closeModal()">取消</button>
                <button style="background: var(--primary-color); color: white;" onclick="saveSectionNote()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // 1. 预置物理 27 章框架数据 (可根据实际教材调整)
        const physicsChapters = [
            { id: 'p-ch1', title: '第1章 物理学简介', desc: '质点、位移、速度与加速度基础概念' },
            { id: 'p-ch2', title: '第2章 物理量的测量、单位和数据处理', desc: '速度与时间、位移与时间的关系及自由落体' },
            { id: 'p-ch3', title: '第3章 直线运动', desc: '重力、弹力、摩擦力及力的合成与分解' },
            { id: 'p-ch4', title: '第4章 牛顿运动定律', desc: '牛顿第一、二、三定律及其综合应用' },
            { id: 'p-ch5', title: '第5章 静力学', desc: '曲线运动、运动的合成与分解、平抛运动' },
            { id: 'p-ch6', title: '第6章 平面运动', desc: '线速度、角速度、向心加速度与向心力' },
            { id: 'p-ch7', title: '第7章 功与能', desc: '开普勒定律、万有引力定律与卫星运动' },
            { id: 'p-ch8', title: '第8章 动量守恒定律', desc: '功、功率、动能定理与机械能守恒' },
            { id: 'p-ch9', title: '第9章 转动', desc: '质点、位移、速度与加速度基础概念' },
            { id: 'p-ch10', title: '第10章 振动', desc: '速度与时间、位移与时间的关系及自由落体' },
            { id: 'p-ch11', title: '第11章 流体力学', desc: '重力、弹力、摩擦力及力的合成与分解' },
            { id: 'p-ch12', title: '第12章 物质的性质', desc: '牛顿第一、二、三定律及其综合应用' },
            { id: 'p-ch13', title: '第13章 温度与热量', desc: '曲线运动、运动的合成与分解、平抛运动' },
            { id: 'p-ch14', title: '第14章 热的传递', desc: '线速度、角速度、向心加速度与向心力' },
            { id: 'p-ch15', title: '第15章 气体定律', desc: '开普勒定律、万有引力定律与卫星运动' },
            { id: 'p-ch16', title: '第16章 气体分子运动论与热力学', desc: '功、功率、动能定理与机械能守恒' },
            { id: 'p-ch17', title: '第17章 机械波', desc: '质点、位移、速度与加速度基础概念' },
            { id: 'p-ch18', title: '第18章 光的反射与折射', desc: '速度与时间、位移与时间的关系及自由落体' },
            { id: 'p-ch19', title: '第19章 棱镜和透镜', desc: '重力、弹力、摩擦力及力的合成与分解' },
            { id: 'p-ch20', title: '第20章 光的波动性', desc: '牛顿第一、二、三定律及其综合应用' },
            { id: 'p-ch21', title: '第21章 电场', desc: '曲线运动、运动的合成与分解、平抛运动' },
            { id: 'p-ch22', title: '第22章 恒定电流', desc: '线速度、角速度、向心加速度与向心力' },
            { id: 'p-ch23', title: '第23章 电流与磁场', desc: '开普勒定律、万有引力定律与卫星运动' },
            { id: 'p-ch24', title: '第24章 电磁感应与交流电', desc: '功、功率、动能定理与机械能守恒' },
            { id: 'p-ch25', title: '第25章 量子物理学', desc: '重力、弹力、摩擦力及力的合成与分解' },
            { id: 'p-ch26', title: '第26章 原子与原子核物理学', desc: '牛顿第一、二、三定律及其综合应用' },
            { id: 'p-ch27', title: '第27章 相对论简介', desc: '曲线运动、运动的合成与分解、平抛运动' },
        ];

        // 2. 小节示例数据（对应第四层具体笔记）
        const defaultSections = [
            {
                id: 'sec-101',
                chapterId: 'p-ch1',
                title: '1.1 质点 参考系',
                desc: '理解理想化模型与参考系的相对性',
                content: `
                    <h3>一、质点 (Particle)</h3>
                    <p>用来代替物体的有质量的点。质点是一种<b>理想化物理模型</b>。</p>
                    <div class="box-yellow">
                        <strong>物体可看作质点的条件：</strong><br>
                        物体的形状和大小对所研究的问题没有影响，或影响可以忽略不计时。
                    </div>
                    <h3>二、参考系 (Reference Frame)</h3>
                    <p>为了研究物体的运动而假定不动的物体。运动和静止都是相对参考系而言的。</p>
                `
            },
            {
                id: 'sec-102',
                chapterId: 'p-ch4',
                title: '4.2 牛顿第二定律',
                desc: '加速度与力、质量的定量关系',
                content: `
                    <h3>一、牛顿第二定律内容</h3>
                    <p>物体的加速度 $a$ 与所受合外力 $F$ 成正比，与物体的质量 $m$ 成反比。</p>
                    <div class="box-yellow">
                        <strong>核心公式：</strong><br>
                        $$F_{合} = m \cdot a$$
                    </div>
                `
            }
        ];

        // 本地数据加载
        let sections = JSON.parse(localStorage.getItem('physics_sections')) || defaultSections;
        let currentSubject = 'physics';
        let currentChapterId = '';
        let currentSectionId = '';

        // 页面跳转控制器
        function navTo(levelId) {
            document.querySelectorAll('.view-page').forEach(el => el.classList.remove('active'));
            document.getElementById(levelId).classList.add('active');
        }

        // 状态更新
        function updateMainBadges() {
            const pCount = sections.length;
            document.getElementById('badge-physics').innerText = `${physicsChapters.length} 章 /已存 ${pCount} 节`;
        }

        // 第一层 -> 第二层 (进入物理章节列表)
        function openSubject(sub) {
            currentSubject = sub;
            if(sub !== 'physics') {
                alert('该学科框架建设中，请先体验物理专栏！');
                return;
            }
            
            document.getElementById('nav-subject-name').innerText = '物理';
            document.getElementById('subject-title').innerText = '物理 · 章节目录 (共 27 章)';
            
            const grid = document.getElementById('chapters-grid');
            grid.innerHTML = '';

            physicsChapters.forEach(ch => {
                const count = sections.filter(s => s.chapterId === ch.id).length;
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openChapter(ch.id);
                card.innerHTML = `
                    <h3>${ch.title}</h3>
                    <p>${ch.desc}</p>
                    <span class="badge">${count} 个已写小节</span>
                `;
                grid.appendChild(card);
            });

            navTo('level-2');
        }

        // 第二层 -> 第三层 (进入具体章节的小节列表)
        function openChapter(chId) {
            currentChapterId = chId;
            const chapter = physicsChapters.find(c => c.id === chId);
            
            document.getElementById('nav-chapter-name').innerText = chapter.title;
            document.getElementById('chapter-title').innerText = chapter.title + ' · 小节卡片';

            renderSectionsGrid();
            navTo('level-3');
        }

        function renderSectionsGrid() {
            const grid = document.getElementById('sections-grid');
            grid.innerHTML = '';

            const subSections = sections.filter(s => s.chapterId === currentChapterId);

            if(subSections.length === 0) {
                grid.innerHTML = `<p style="color:var(--text-muted); grid-column:1/-1;">本章暂无小节笔记，请点击右上角“+ 新建知识点小节”添加！</p>`;
            } else {
                subSections.forEach(sec => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => openSectionDetail(sec.id);
                    card.innerHTML = `<h3>${sec.title}</h3><p>${sec.desc || '点击查看完整笔记...'}</p>`;
                    grid.appendChild(card);
                });
            }
        }

        // 第三层 -> 第四层 (进入正文)
        function openSectionDetail(secId) {
            currentSectionId = secId;
            const sec = sections.find(s => s.id === secId);
            if(!sec) return;

            document.getElementById('detail-title').innerText = sec.title;
            document.getElementById('detail-content').innerHTML = sec.content;

            navTo('level-4');

            // 触发公式渲染
            if (window.renderMathInElement) {
                renderMathInElement(document.getElementById('detail-content'));
            }
        }

        // 弹窗逻辑
        function openAddModal() {
            currentSectionId = null;
            document.getElementById('modal-heading').innerText = '新建小节笔记';
            
            // 动态填充章节下拉框
            const select = document.getElementById('modal-chapter-select');
            select.innerHTML = '';
            physicsChapters.forEach(ch => {
                select.innerHTML += `<option value="${ch.id}">${ch.title}</option>`;
            });
            if(currentChapterId) select.value = currentChapterId;

            document.getElementById('modal-title').value = '';
            document.getElementById('modal-desc').value = '';
            document.getElementById('modal-content').value = '';
            document.getElementById('modal').style.display = 'flex';
        }

        function openEditModal() {
            const sec = sections.find(s => s.id === currentSectionId);
            if(!sec) return;

            document.getElementById('modal-heading').innerText = '编辑小节笔记';
            
            const select = document.getElementById('modal-chapter-select');
            select.innerHTML = '';
            physicsChapters.forEach(ch => {
                select.innerHTML += `<option value="${ch.id}">${ch.title}</option>`;
            });
            select.value = sec.chapterId;

            document.getElementById('modal-title').value = sec.title;
            document.getElementById('modal-desc').value = sec.desc;
            document.getElementById('modal-content').value = sec.content;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function saveSectionNote() {
            const chapterId = document.getElementById('modal-chapter-select').value;
            const title = document.getElementById('modal-title').value;
            const desc = document.getElementById('modal-desc').value;
            const content = document.getElementById('modal-content').value;

            if(!title) { alert('小节标题不能为空！'); return; }

            if(currentSectionId) {
                const sec = sections.find(s => s.id === currentSectionId);
                sec.chapterId = chapterId;
                sec.title = title;
                sec.desc = desc;
                sec.content = content;
                openSectionDetail(currentSectionId);
            } else {
                const newSec = {
                    id: 'sec-' + Date.now(),
                    chapterId, title, desc, content
                };
                sections.unshift(newSec);
                currentChapterId = chapterId;
                openChapter(chapterId);
            }

            localStorage.setItem('physics_sections', JSON.stringify(sections));
            closeModal();
            updateMainBadges();
        }

        // 初始化页面
        updateMainBadges();
    </script>
</body>
</html>
